name: OMP Android native compatibility

on:
  push:
    branches:
      - feat/embedded-omp-tui-mvp
    paths:
      - ".github/workflows/omp-native-android-check.yml"
      - "docs/ANDROID_RUNTIME.md"
      - "tools/patch-omp-android.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pi-natives:
    name: Cross-check pi-natives for Android ARM64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout pinned upstream OMP
        uses: actions/checkout@v4
        with:
          repository: can1357/oh-my-pi
          ref: 24439066040e006eb08da7b204f0ac41c79d2de9
          path: upstream-omp

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install pinned NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Set up Rust nightly and Android target
        run: |
          rustup toolchain install nightly-2026-10-06 --profile minimal
          rustup target add aarch64-linux-android --toolchain nightly-2026-10-06

      - name: Patch upstream Android libc compatibility
        run: python3 ../tools/patch-omp-android.py
        working-directory: upstream-omp

      - name: Cross-check pi-natives
        working-directory: upstream-omp
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          export CMAKE_ANDROID_NDK="$ANDROID_NDK_HOME"
          cargo +nightly-2026-10-06 check --locked -p pi-natives --target aarch64-linux-android

      - name: Upload Cargo diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omp-android-native-check-logs
          path: upstream-omp/target/aarch64-linux-android/
          if-no-files-found: ignore
          retention-days: 7
