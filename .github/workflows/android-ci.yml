name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate terminal smoke script syntax
        run: |
          bash -n tools/terminal-compat-smoke.sh
          bash -n tools/verify-android-bun.sh
      - name: Fetch pinned Android ARM64 Bun
        run: |
          curl --fail --location --retry 3 \
            https://github.com/PlayWithG/bun/releases/download/termux-v1.4.2/bun \
            --output "$RUNNER_TEMP/bun-android-arm64"
      - name: Verify Android Bun checksum and ELF dependencies
        run: bash tools/verify-android-bun.sh "$RUNNER_TEMP/bun-android-arm64"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omp-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
